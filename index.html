<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Barkodu okut, ürünü bul, mağaza fiyatlarını birim fiyatla karşılaştır." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mikro Barkod" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Mikro Barkod</title>
    <script>
      // Tema, sayfa çizilmeden uygulanır (beyaz/siyah yanıp sönmeyi önler).
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('mb_theme') || '"system"');
          var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0a0b' : '#f5f5f7');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Mikro Barkod çalışmak için JavaScript gerektirir.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
